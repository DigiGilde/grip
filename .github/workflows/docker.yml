name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  # One OpenFSC version: the base of the wrapper images, and the stock images
  # below, pinned by digest. Change them together.
  OPENFSC_VERSION: v2.8.0
  OPENFSC_INWAY: docker.io/federatedserviceconnectivity/inway:v2.8.0@sha256:af86cb93ba98b1382a7e11d8894cdcbdee9624c7d1d161e85d4733000c39bc92
  OPENFSC_OUTWAY: docker.io/federatedserviceconnectivity/outway:v2.8.0@sha256:604053951d2fe37478653fe8eaa66113e0927b2484c80529f466b36b289e0dbf
  OPENFSC_DIRECTORY_UI: docker.io/federatedserviceconnectivity/directory-ui:v2.8.0@sha256:d5ad0c9046d6ba6d23f29c9667d98df8fb14f62fb877eff09da1ecaf9c5ce505

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: production
          - image: fsc-manager
            context: ./deploy/zad/fsc/images/manager
            dockerfile: ./deploy/zad/fsc/images/manager/Dockerfile
          - image: fsc-controller
            context: ./deploy/zad/fsc/images/controller
            dockerfile: ./deploy/zad/fsc/images/controller/Dockerfile
          - image: fsc-txlog
            context: ./deploy/zad/fsc/images/txlog
            dockerfile: ./deploy/zad/fsc/images/txlog/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # ghcr.io wants a lowercase path; the organisation name may not be.
      - name: Compute image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prefix.outputs.value }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "git_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.build_meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            OPENFSC_VERSION=${{ env.OPENFSC_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The bootstrap of the FSC peers builds on its own, so a failure here never
  # cancels or holds up the images and the deploy of grip. Its build context
  # is deploy/zad/fsc; the .dockerignore there lets only bootstrap.sh in.
  build-fsc-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Compute image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prefix.outputs.value }}/fsc-bootstrap
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/zad/fsc
          file: ./deploy/zad/fsc/images/bootstrap/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fsc-bootstrap
          cache-to: type=gha,mode=max,scope=fsc-bootstrap

  # Deploy to ZAD. Skipped until the repository is configured:
  #
  #   variable  ZAD_PROJECT_ID       the ZAD project of the instances
  #   variable  ZAD_DEPLOYMENTS      optional, the deployments that run grip,
  #                                  as JSON: ["gilde","programma"]
  #   variable  ZAD_DEPLOYMENT_NAME  optional, the one deployment when
  #                                  ZAD_DEPLOYMENTS is not set; defaults to "main"
  #   variable  ZAD_FSC_DEPLOYMENTS  optional, the deployments with FSC and the
  #                                  key of their peer, as JSON:
  #                                  {"directory":"dir","gilde":"a","programma":"d"}
  #   secret    ZAD_API_KEY          set with: gh secret set ZAD_API_KEY
  #
  # Convention, as in the settings derivation in backend/grip/core/config.py:
  # component-1 is the frontend, component-2 the backend. A deployment with
  # FSC also runs the federation listener from the backend image; it uses the
  # schema that component-2 migrates, so the two move together. The listener
  # is only deployed where ZAD_FSC_DEPLOYMENTS names it: the first deploy of a
  # component adds it to the deployment, settings or not.
  deploy:
    needs: build
    if: vars.ZAD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(vars.ZAD_DEPLOYMENTS || format('["{0}"]', vars.ZAD_DEPLOYMENT_NAME || 'main')) }}

    steps:
      - name: Compute the components
        id: components
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          FSC_DEPLOYMENTS: ${{ vars.ZAD_FSC_DEPLOYMENTS || '{}' }}
        run: |
          if ! jq -e 'type == "object" and all(.[]; IN("dir", "a", "b", "d", "e", "g", "o", "z"))' <<< "$FSC_DEPLOYMENTS" > /dev/null 2>&1; then
            echo '::error title=ZAD_FSC_DEPLOYMENTS::not a JSON object from deployment to peer key (dir, a, b, d, e, g, o or z), such as {"directory":"dir","gilde":"a","programma":"d"}'
            exit 1
          fi
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          components="$(jq -nc --arg prefix "$prefix" --arg tag "$tag" --arg deployment "$DEPLOYMENT" \
            --argjson fsc "$FSC_DEPLOYMENTS" '
            [{name: "component-2", image: "\($prefix)/backend:\($tag)"},
             {name: "component-1", image: "\($prefix)/frontend:\($tag)"}]
            + if ($fsc[$deployment] // "dir") == "dir" then []
              else [{name: "federation", image: "\($prefix)/backend:\($tag)"}] end')"
          echo "value=$components" >> "$GITHUB_OUTPUT"

      - name: Deploy to ZAD
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: ${{ matrix.deployment }}
          components: ${{ steps.components.outputs.value }}

  # The FSC components of the example group. They follow a change to their
  # images or to this workflow, not every push: a new image restarts the
  # mesh. bootstrap.sh and the .dockerignore next to it make up the bootstrap
  # image. Other pushes leave them as they run; a deploy that failed here is
  # run again by hand.
  fsc-plan:
    if: vars.ZAD_PROJECT_ID != '' && vars.ZAD_FSC_DEPLOYMENTS != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      targets: ${{ steps.targets.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Look for a change to the FSC images
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push, or history that was rewritten: nothing to compare with.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet --no-renames "$BEFORE" "$GITHUB_SHA" -- \
              deploy/zad/fsc/images deploy/zad/fsc/bootstrap.sh deploy/zad/fsc/.dockerignore \
              .github/workflows/docker.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List the deployments
        id: targets
        env:
          FSC_DEPLOYMENTS: ${{ vars.ZAD_FSC_DEPLOYMENTS }}
        run: |
          if ! jq -e 'type == "object" and all(.[]; IN("dir", "a", "b", "d", "e", "g", "o", "z"))' <<< "$FSC_DEPLOYMENTS" > /dev/null 2>&1; then
            echo '::error title=ZAD_FSC_DEPLOYMENTS::not a JSON object from deployment to peer key (dir, a, b, d, e, g, o or z), such as {"directory":"dir","gilde":"a","programma":"d"}'
            exit 1
          fi
          echo "value=$(jq -c 'to_entries | map({deployment: .key, peer: .value})' <<< "$FSC_DEPLOYMENTS")" >> "$GITHUB_OUTPUT"

  # After the deploy of grip, whatever its outcome: two deploys to one
  # deployment at the same time hand over to each other.
  deploy-fsc:
    needs: [build, build-fsc-bootstrap, fsc-plan, deploy]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.build-fsc-bootstrap.result == 'success'
      && needs.fsc-plan.result == 'success'
      && needs.fsc-plan.outputs.changed == 'true' && needs.fsc-plan.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fsc-plan.outputs.targets) }}

    steps:
      - name: Compute the components
        id: components
        env:
          PEER: ${{ matrix.peer }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          if [ "$PEER" = dir ]; then
            components="$(jq -nc --arg manager "$prefix/fsc-manager:$tag" --arg ui "$OPENFSC_DIRECTORY_UI" \
              '[{name: "dirmgr", image: $manager}, {name: "dirui", image: $ui}]')"
          else
            components="$(jq -nc --arg prefix "$prefix" --arg tag "$tag" --arg peer "$PEER" \
              --arg inway "$OPENFSC_INWAY" --arg outway "$OPENFSC_OUTWAY" '
              [{name: "manager", image: "\($prefix)/fsc-manager:\($tag)"},
               {name: "controller", image: "\($prefix)/fsc-controller:\($tag)"},
               {name: "txlog", image: "\($prefix)/fsc-txlog:\($tag)"},
               {name: "inway", image: $inway},
               {name: "outway", image: $outway},
               {name: "fscboot-\($peer)", image: "\($prefix)/fsc-bootstrap:\($tag)"}]')"
          fi
          echo "value=$components" >> "$GITHUB_OUTPUT"

      - name: Deploy to ZAD
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: ${{ matrix.deployment }}
          components: ${{ steps.components.outputs.value }}

  # The ontwikkelportaal builds on its own, so a failure here never cancels or
  # holds up the images and the deploy of the instance.
  build-ontwikkelportaal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Compute image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prefix.outputs.value }}/ontwikkelportaal
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ontwikkelportaal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ontwikkelportaal
          cache-to: type=gha,mode=max,scope=ontwikkelportaal

  # The ontwikkelportaal is the start page of the example instances: a
  # deployment of its own, "portaal", in the project of the example instance.
  # See docs/uitrol-zad.md.
  deploy-ontwikkelportaal:
    needs: build-ontwikkelportaal
    if: vars.ZAD_PROJECT_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Compute image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/ontwikkelportaal:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy the ontwikkelportaal to ZAD
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: portaal
          component: ontwikkelportaal
          image: ${{ steps.image.outputs.ref }}
          wait-for-ready: true
