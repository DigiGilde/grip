# The database of the local Wies. Wies itself runs from its checkout on the
# host (see ../wies.sh). Own project name and port.

name: grip-local-wies

services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:9301:5432"
    environment:
      POSTGRES_USER: wies
      POSTGRES_PASSWORD: wies
      POSTGRES_DB: wies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wies -d wies"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
