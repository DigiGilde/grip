services:
  # --- Instance A: the contractor ------------------------------------------
  db-a:
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-a:
    image: grip-local/backend
    environment:
      <<: *instance-a-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-a:
        condition: service_healthy

  frontend-a:
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-a:8080
    ports:
      - "127.0.0.1:9001:8080"
    # nginx resolves the backend's address once, at start. When the backend
    # container is recreated it may get another address (and the old one may
    # go to a different container), so nginx has to restart with it.
    depends_on:
      backend-a:
        condition: service_started
        restart: true

  # --- Instance B: the client. Only with `--profile two` -------------------
  db-b:
    profiles: ["two"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-b:
    profiles: ["two"]
    image: grip-local/backend
    environment:
      <<: *instance-b-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-b:
        condition: service_healthy

  frontend-b:
    profiles: ["two"]
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-b:8080
    ports:
      - "127.0.0.1:9002:8080"
    depends_on:
      backend-b:
        condition: service_started
        restart: true

  # --- Instance D: the programme that A works for. Only with `--profile two` -------------------
  db-d:
    profiles: ["two"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-d:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-d:
    profiles: ["two"]
    image: grip-local/backend
    environment:
      <<: *instance-d-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-d:
        condition: service_healthy

  frontend-d:
    profiles: ["two"]
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-d:8080
    ports:
      - "127.0.0.1:9003:8080"
    depends_on:
      backend-d:
        condition: service_started
        restart: true

  # --- Instance E: NLDD voorbeeld. Only with `--profile keten` -------------------
  db-e:
    profiles: ["keten"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-e:
    profiles: ["keten"]
    image: grip-local/backend
    environment:
      <<: *instance-e-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-e:
        condition: service_healthy

  frontend-e:
    profiles: ["keten"]
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-e:8080
    ports:
      - "127.0.0.1:9004:8080"
    depends_on:
      backend-e:
        condition: service_started
        restart: true

  # --- Instance G: GDI voorbeeld. Only with `--profile keten` -------------------
  db-g:
    profiles: ["keten"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
