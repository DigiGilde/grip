        condition: service_started
        restart: true

  # --- Instance O: ODI voorbeeld. Only with `--profile keten` -------------------
  db-o:
    profiles: ["keten"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-o:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-o:
    profiles: ["keten"]
    image: grip-local/backend
    environment:
      <<: *instance-o-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-o:
        condition: service_healthy

  frontend-o:
    profiles: ["keten"]
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-o:8080
    ports:
      - "127.0.0.1:9006:8080"
    depends_on:
      backend-o:
        condition: service_started
        restart: true

  # --- Instance Z: Ministerie van EZK voorbeeld. Only with `--profile keten` -------------------
  db-z:
    profiles: ["keten"]
    image: postgres:16
    environment:
      POSTGRES_USER: grip
      POSTGRES_PASSWORD: grip
      POSTGRES_DB: grip
    volumes:
      - db-z:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grip -d grip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-z:
    profiles: ["keten"]
    image: grip-local/backend
    environment:
      <<: *instance-z-env
      GRIP_PROCESS: web
    volumes:
      - ./state/tls:/tls:ro
    depends_on:
      db-z:
        condition: service_healthy

  frontend-z:
    profiles: ["keten"]
    image: grip-local/frontend
    environment:
      BACKEND_URL: http://backend-z:8080
    ports:
      - "127.0.0.1:9007:8080"
    depends_on:
      backend-z:
        condition: service_started
        restart: true

  # --- Ontwikkelportaal: docs and links to all instances. Only with `--profile two`
  ontwikkelportaal:
    profiles: ["two"]
    image: grip-local/ontwikkelportaal
    environment:
      ONTWIKKELPORTAAL_INSTANCES: >-
        [{"naam": "GDI voorbeeld", "rol": "Opdrachtgever",
          "omschrijving": "Keurt het programma MOZa voorbeeld goed en legt het opdrachtgeverschap bij het Ministerie van BZK voorbeeld.",
          "url": "http://localhost:9005"},
         {"naam": "Ministerie van BZK voorbeeld", "rol": "Ministerie",
          "omschrijving": "Gedelegeerd opdrachtgever namens GDI: geeft MOZa voorbeeld het jaarbudget en ODI voorbeeld de opdracht voor de uitvoering.",
          "url": "http://localhost:9002"},
         {"naam": "MOZa voorbeeld", "rol": "Programma",
          "omschrijving": "Geeft opdrachten aan DigiGilde voorbeeld en boekt kosten die een leverancier voor het programma doet.",
          "url": "http://localhost:9003"},
         {"naam": "ODI voorbeeld", "rol": "Opdrachtnemer",
          "omschrijving": "Agentschap en contractpartij van het programma; moeder van DigiGilde voorbeeld.",
          "url": "http://localhost:9006"},
         {"naam": "DigiGilde voorbeeld", "rol": "Opdrachtnemer",
          "omschrijving": "Maakt offertes, voert opdrachten uit, sluit maanden af en factureert.",
          "url": "http://localhost:9001"},
         {"naam": "Ministerie van EZK voorbeeld", "rol": "Ministerie",
          "omschrijving": "Moeder van NLDD voorbeeld.",
          "url": "http://localhost:9007"},
         {"naam": "NLDD voorbeeld", "rol": "Opdrachtgever",
          "omschrijving": "Geeft DigiGilde voorbeeld opdrachten en volgt ze: de stand en de uitputting.",
          "url": "http://localhost:9004"}]
    ports:
      - "127.0.0.1:9000:8080"

  # A local identity provider, to run the real login code path without any
  # outside account. Only with `--profile keycloak` (just local-up keycloak).
  keycloak:
    profiles: ["keycloak"]
    image: keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The address in tokens and redirects is the one the browser uses;
      # the backend may call the token endpoint on the internal address.
      KC_HOSTNAME: https://localhost:9443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # TLS with the private CA from setup.sh: grip does not send tokens to
      # a provider over plain http, also not locally.
      KC_HTTPS_CERTIFICATE_FILE: /tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/keycloak.key
    volumes:
      - ./state/keycloak:/opt/keycloak/data/import:ro
      - ./state/tls:/tls:ro
    ports:
      - "127.0.0.1:9443:8443"

