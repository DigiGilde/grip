# FSC between the two local grip instances, in a private group.
#
# Used together with compose.yml:
#   docker compose -f compose.yml -f compose.fsc.yml ...   (just local-up fsc)
#
# Per peer: manager, controller, inway, outway and transaction log, each
# with its own database; one directory for the group (a manager that signs
# publications automatically, with its controller). Images: Open FSC
# 2.8.0, the current name of what was FSC NLX. Certificates come from
# ./fsc-pki.sh; nothing here is PKIoverheid.
#
# The audit log goes to the container log (auditlog-type stdout); the
# separate audit log component is left out.

x-fsc-common: &fsc-common
  restart: on-failure
  volumes:
    - ./state/pki:/pki:ro

# What federation adds to a grip instance: the web process must know that
# outbound federation is on (domain events become outbox messages inside web
# requests), a listener that only the inway reaches, and a worker that sends
# the outbox through the outway.
x-grip-federation-a: &grip-federation-a
  FEDERATION_INBOUND_ENABLED: "1"
  FEDERATION_OUTBOUND_ENABLED: "1"
  OUTWAY_URL: http://outway-a:8080
  FEDERATION_OUTBOX_INTERVAL_SECONDS: "3"
  RUN_MIGRATIONS: "0"

x-grip-federation-b: &grip-federation-b
  FEDERATION_INBOUND_ENABLED: "1"
  FEDERATION_OUTBOUND_ENABLED: "1"
  OUTWAY_URL: http://outway-b:8080
  FEDERATION_OUTBOX_INTERVAL_SECONDS: "3"
  RUN_MIGRATIONS: "0"

services:
  backend-a:
    environment:
      FEDERATION_OUTBOUND_ENABLED: "1"
      OUTWAY_URL: http://outway-a:8080

  backend-b:
    environment:
      FEDERATION_OUTBOUND_ENABLED: "1"
      OUTWAY_URL: http://outway-b:8080

  # The listener has no published port: only the inway may reach it.
  federation-a:
    extends:
      file: compose.yml
      service: backend-a
    environment:
      <<: *grip-federation-a
      GRIP_PROCESS: federation
    depends_on:
      backend-a:
        condition: service_started

  worker-a:
    extends:
      file: compose.yml
      service: backend-a
    environment:
      <<: *grip-federation-a
      GRIP_PROCESS: worker
    depends_on:
      backend-a:
        condition: service_started

  federation-b:
    extends:
      file: compose.yml
      service: backend-b
    environment:
      <<: *grip-federation-b
      GRIP_PROCESS: federation
    depends_on:
      backend-b:
        condition: service_started

  worker-b:
    extends:
      file: compose.yml
      service: backend-b
    environment:
      <<: *grip-federation-b
      GRIP_PROCESS: worker
    depends_on:
      backend-b:
        condition: service_started

  fsc-db:
    image: postgres:16
    environment:
      POSTGRES_USER: fsc
      POSTGRES_PASSWORD: fsc
      POSTGRES_DB: fsc
    volumes:
      - fsc-db:/var/lib/postgresql/data
      - ./fsc-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsc -d fsc_manager_b"]
      interval: 3s
      timeout: 3s
      retries: 30

  # --- The directory of the group ---------------------------------------

  fsc-migrate-manager-dir:
    image: federatedserviceconnectivity/manager:v2.8.0
    command:
      - "/usr/local/bin/manager"
      - "migrate"
      - "up"
      - "--postgres-dsn"
      - "postgresql://fsc:fsc@fsc-db:5432/fsc_manager_dir?sslmode=disable&connect_timeout=5"
    restart: on-failure
    depends_on:
      fsc-db:
        condition: service_healthy

  fsc-migrate-controller-dir:
    image: federatedserviceconnectivity/controller:v2.8.0
    command:
      - "/usr/local/bin/controller"
      - "migrate"
      - "up"
      - "--postgres-dsn"
      - "postgresql://fsc:fsc@fsc-db:5432/fsc_controller_dir?sslmode=disable&connect_timeout=5"
    restart: on-failure
    depends_on:
      fsc-db:
        condition: service_healthy

  manager-dir:
    <<: *fsc-common
    image: federatedserviceconnectivity/manager:v2.8.0
    command:
      - "/usr/local/bin/manager"
      - "serve"
      - "--listen-address-external"
      - "0.0.0.0:8443"
      - "--listen-address-internal"
      - "0.0.0.0:8444"
      - "--listen-address-internal-unauthenticated"
      - "0.0.0.0:8445"
      - "--monitoring-address"
      - "0.0.0.0:8081"
      - "--group-id"
      - "grip-local"
      - "--self-address"
      - "https://manager-dir:8443"
      - "--directory-manager-address"
      - "https://manager-dir:8443"
      - "--directory-peer-id"
      - "01700000000000000099"
      - "--controller-registration-api-address"
      - "https://controller-dir:8443"
      - "--storage-postgres-dsn"
      - "postgresql://fsc:fsc@fsc-db:5432/fsc_manager_dir?sslmode=disable&connect_timeout=5"
      - "--auto-sign-grants"
      - "servicePublication,delegatedServicePublication"
      - "--auditlog-type"
      - "stdout"
      - "--tls-group-root-cert"
      - "/pki/group/ca.pem"
      - "--tls-group-cert"
      - "/pki/group/dir/manager/cert.pem"
      - "--tls-group-key"
      - "/pki/group/dir/manager/key.pem"
      - "--tls-group-token-cert"
      - "/pki/group/dir/manager/cert.pem"
      - "--tls-group-token-key"
      - "/pki/group/dir/manager/key.pem"
      - "--tls-group-contract-cert"
      - "/pki/group/dir/manager/cert.pem"
      - "--tls-group-contract-key"
      - "/pki/group/dir/manager/key.pem"
      - "--tls-root-cert"
      - "/pki/internal/dir/ca.pem"
      - "--tls-cert"
      - "/pki/internal/dir/manager/cert.pem"
      - "--tls-key"
      - "/pki/internal/dir/manager/key.pem"
      - "--tls-internal-unauthenticated-root-cert"
      - "/pki/internal/dir/ca.pem"
      - "--tls-internal-unauthenticated-cert"
      - "/pki/internal/dir/manager/cert.pem"
      - "--tls-internal-unauthenticated-key"
      - "/pki/internal/dir/manager/key.pem"
      - "--log-type"
      - "local"
      - "--log-level"
      - "info"
    depends_on:
      fsc-migrate-manager-dir:
        condition: service_completed_successfully

  controller-dir:
    <<: *fsc-common
    image: federatedserviceconnectivity/controller:v2.8.0
    command:
      - "/usr/local/bin/controller"
      - "serve"
      - "--listen-address-ui"
      - "0.0.0.0:3000"
      - "--listen-address-registration-api"
      - "0.0.0.0:8443"
      - "--listen-address-administration-api"
      - "0.0.0.0:8444"
      - "--monitoring-address"
      - "0.0.0.0:8081"
      - "--group-id"
      - "grip-local"
      - "--directory-peer-id"
      - "01700000000000000099"
      - "--manager-address-internal"
      - "https://manager-dir:8444"
      - "--storage-postgres-dsn"
      - "postgresql://fsc:fsc@fsc-db:5432/fsc_controller_dir?sslmode=disable&connect_timeout=5"
      - "--tls-root-cert"
      - "/pki/internal/dir/ca.pem"
      - "--tls-cert"
      - "/pki/internal/dir/controller/cert.pem"
      - "--tls-key"
      - "/pki/internal/dir/controller/key.pem"
      - "--auditlog-type"
      - "stdout"
      - "--log-type"
      - "local"
      - "--log-level"
      - "info"
    ports:
      - "127.0.0.1:9100:3000"
    depends_on:
      fsc-migrate-controller-dir:
        condition: service_completed_successfully

  # --- Peer A: DigiGilde voorbeeld (opdrachtnemer) ------------------------

